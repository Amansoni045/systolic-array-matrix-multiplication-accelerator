<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" width="1150" height="680" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="575" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Computational Throughput &amp; MAC Rate Scaling at 100 MHz</text>
  <text x="575" y="60" text-anchor="middle" font-size="14" fill="#64748b">Comparison of Mega-MACs per Second (MMAC/s) and Initiation Interval Speedup</text>

  <!-- Left: Throughput Bar Chart -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="560" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Throughput (MMAC/s) Across Matrix Size N</text>

    <g transform="translate(70, 70)">
      <!-- Axes -->
      <line x1="0" y1="360" x2="440" y2="360" stroke="#475569" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="360" stroke="#475569" stroke-width="2"/>

      <!-- Y-ticks: 0, 500, 1000, 1500, 2000, 2500 MMAC/s -->
      <!-- Scale: 360 px = 2500 MMAC/s -> y = 360 - val * (360/2500) = 360 - val * 0.144 -->
      <line x1="0" y1="360" x2="440" y2="360" stroke="#e2e8f0" stroke-width="1"/>
      <text x="-12" y="364" text-anchor="end" font-size="11" fill="#64748b">0</text>

      <line x1="0" y1="288" x2="440" y2="288" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="292" text-anchor="end" font-size="11" fill="#64748b">500</text>

      <line x1="0" y1="216" x2="440" y2="216" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="220" text-anchor="end" font-size="11" fill="#64748b">1000</text>

      <line x1="0" y1="144" x2="440" y2="144" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="148" text-anchor="end" font-size="11" fill="#64748b">1500</text>

      <line x1="0" y1="72" x2="440" y2="72" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="76" text-anchor="end" font-size="11" fill="#64748b">2000</text>

      <!-- N=1: (x=30) Seq: 50.0 (h=7.2, y=352.8) | Sys: 33.33 (h=4.8, y=355.2) -->
      <rect x="25" y="352.8" width="18" height="7.2" fill="#ef4444"/>
      <rect x="45" y="355.2" width="18" height="4.8" fill="#2563eb"/>
      <text x="44" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">N=1</text>

      <!-- N=2: (x=115) Seq: 88.89 (h=12.8, y=347.2) | Sys: 133.33 (h=19.2, y=340.8) -->
      <rect x="110" y="347.2" width="18" height="12.8" fill="#ef4444"/>
      <rect x="130" y="340.8" width="18" height="19.2" fill="#2563eb"/>
      <text x="129" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">N=2</text>

      <!-- N=3: (x=200) Seq: 96.43 (h=13.9, y=346.1) | Sys: 300.00 (h=43.2, y=316.8) -->
      <rect x="195" y="346.1" width="18" height="13.9" fill="#ef4444"/>
      <rect x="215" y="316.8" width="18" height="43.2" fill="#2563eb"/>
      <text x="214" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">N=3</text>

      <!-- N=4: (x=285) Seq: 98.46 (h=14.2, y=345.8) | Sys: 533.33 (h=76.8, y=283.2) -->
      <rect x="280" y="345.8" width="18" height="14.2" fill="#ef4444"/>
      <rect x="300" y="283.2" width="18" height="76.8" fill="#2563eb"/>
      <text x="299" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">N=4</text>
      <text x="309" y="275" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">533.3</text>

      <!-- N=8: (x=370) Seq: 99.81 (h=14.4, y=345.6) | Sys: 2133.33 (h=307.2, y=52.8) -->
      <rect x="365" y="345.6" width="22" height="14.4" fill="#ef4444"/>
      <rect x="390" y="52.8" width="22" height="307.2" fill="#2563eb"/>
      <text x="388" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">N=8</text>
      <text x="401" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">2,133.3 MMAC/s</text>
    </g>

    <!-- Legend -->
    <g transform="translate(80, 480)">
      <rect x="0" y="0" width="16" height="16" fill="#ef4444"/>
      <text x="25" y="13" font-size="12" font-weight="bold" fill="#1e293b">Sequential Reference (&#8804; 100 MMAC/s)</text>

      <rect x="260" y="0" width="16" height="16" fill="#2563eb"/>
      <text x="285" y="13" font-size="12" font-weight="bold" fill="#1e293b">Systolic Array (Scales as O(N&#178;))</text>
    </g>
  </g>

  <!-- Right: Efficiency & Initiation Interval Analysis -->
  <g transform="translate(640, 85)">
    <rect x="0" y="0" width="460" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="230" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Sustained Streaming &amp; Hardware Efficiency</text>

    <!-- Formula Box -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="410" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="28" font-size="13" font-weight="bold" fill="#1e40af">Sustained Initiation Interval (II):</text>
      <text x="30" y="52" font-size="12" fill="#1e3a8a">&#8226; Systolic II = 3N clock cycles (continuous streaming)</text>
      <text x="30" y="74" font-size="12" fill="#1e3a8a">&#8226; Sequential II = N&#179; + 1 clock cycles</text>
      <text x="30" y="96" font-size="12" fill="#1e3a8a">&#8226; Speedup(II) = (N&#179; + 1) / 3N &#8776; N&#178; / 3</text>
    </g>

    <!-- Table of II values -->
    <g transform="translate(25, 190)">
      <rect x="0" y="0" width="410" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="410" height="30" rx="6" fill="#334155"/>
      <text x="25" y="20" font-size="11" font-weight="bold" fill="#ffffff">N</text>
      <text x="80" y="20" font-size="11" font-weight="bold" fill="#ffffff">Systolic II</text>
      <text x="180" y="20" font-size="11" font-weight="bold" fill="#ffffff">Sequential II</text>
      <text x="300" y="20" font-size="11" font-weight="bold" fill="#ffffff">II Speedup</text>

      <!-- Rows -->
      <text x="25" y="52" font-size="11" font-weight="bold" fill="#334155">1</text>
      <text x="80" y="52" font-size="11" fill="#334155">3 cyc</text>
      <text x="180" y="52" font-size="11" fill="#334155">2 cyc</text>
      <text x="300" y="52" font-size="11" fill="#64748b">0.67x</text>

      <line x1="10" y1="62" x2="400" y2="62" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="80" font-size="11" font-weight="bold" fill="#334155">2</text>
      <text x="80" y="80" font-size="11" fill="#334155">6 cyc</text>
      <text x="180" y="80" font-size="11" fill="#334155">9 cyc</text>
      <text x="300" y="80" font-size="11" font-weight="bold" fill="#047857">1.50x</text>

      <line x1="10" y1="90" x2="400" y2="90" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="108" font-size="11" font-weight="bold" fill="#334155">4</text>
      <text x="80" y="108" font-size="11" fill="#334155">12 cyc</text>
      <text x="180" y="108" font-size="11" fill="#334155">65 cyc</text>
      <text x="300" y="108" font-size="11" font-weight="bold" fill="#047857">5.42x</text>

      <line x1="10" y1="118" x2="400" y2="118" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="136" font-size="11" font-weight="bold" fill="#1e40af">8</text>
      <text x="80" y="136" font-size="11" font-weight="bold" fill="#1e40af">24 cyc</text>
      <text x="180" y="136" font-size="11" font-weight="bold" fill="#1e40af">513 cyc</text>
      <text x="300" y="136" font-size="12" font-weight="bold" fill="#1e40af">21.38x</text>
    </g>

    <!-- Area vs Throughput Tradeoff Box -->
    <g transform="translate(25, 360)">
      <rect x="0" y="0" width="410" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="28" font-size="13" font-weight="bold" fill="#0f172a">Area / Throughput Tradeoff Analysis:</text>

      <text x="20" y="52" font-size="11" fill="#334155">&#8226; <tspan font-weight="bold">Hardware Multipliers:</tspan> Systolic uses N&#178; PEs (64 at N=8) versus 1 for the sequential baseline.</text>
      <text x="20" y="78" font-size="11" fill="#334155">&#8226; <tspan font-weight="bold">Efficiency:</tspan> The 21.38x speedup achieved with 64 PEs reflects an array efficiency of 33.4% (characteristic of output-stationary skew and drain phases).</text>
      <text x="20" y="112" font-size="11" fill="#334155">&#8226; <tspan font-weight="bold">Bandwidth Intensity:</tspan> Systolic reuses data N times via internal forwarding registers, slashing off-chip memory traffic by N&#215;.</text>
    </g>
  </g>
</svg>