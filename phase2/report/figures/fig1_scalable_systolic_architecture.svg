<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 780" width="1250" height="780" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="625" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Scalable Output-Stationary Systolic Array Accelerator (N x N Parameterized)</text>
  <text x="625" y="60" text-anchor="middle" font-size="14" fill="#64748b">Parameterized Array Size (N), Data Width (DATA_WIDTH), and Accumulator Width (ACC_WIDTH)</text>

  <!-- LEFT: Processing Element (PE) Architecture (Member 1 Contribution) -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="530" height="660" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="530" height="42" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="265" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Processing Element (PE) Internal Datapath (Member 1)</text>

    <!-- Inputs -->
    <rect x="30" y="70" width="130" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="95" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">a_in [DW-1:0]</text>

    <rect x="30" y="125" width="130" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="95" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">b_in [DW-1:0]</text>

    <rect x="30" y="180" width="130" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="95" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">a_valid / b_valid</text>

    <!-- Signed Multiplier -->
    <rect x="210" y="80" width="120" height="65" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="270" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Signed Multiplier</text>
    <text x="270" y="128" text-anchor="middle" font-size="11" fill="#4338ca">DW x DW = 2DW</text>

    <!-- Adder / Accumulator -->
    <rect x="210" y="185" width="120" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="270" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Accumulator Adder</text>
    <text x="270" y="233" text-anchor="middle" font-size="11" fill="#15803d">2DW + ACC_WIDTH</text>

    <!-- Accumulator Register -->
    <rect x="200" y="290" width="140" height="55" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
    <text x="270" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Accumulator Reg</text>
    <text x="270" y="333" text-anchor="middle" font-size="11" fill="#166534">[ACC_WIDTH-1:0]</text>

    <!-- Control Ports -->
    <rect x="30" y="300" width="110" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="85" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">clear_acc / rst_n</text>

    <!-- Forwarding Pipeline Registers -->
    <g transform="translate(370, 70)">
      <rect x="0" y="0" width="130" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">a_out Reg [DW-1:0]</text>
      <text x="65" y="36" text-anchor="middle" font-size="10" fill="#6d28d9">Horizontal Fwd</text>
    </g>

    <g transform="translate(370, 125)">
      <rect x="0" y="0" width="130" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">b_out Reg [DW-1:0]</text>
      <text x="65" y="36" text-anchor="middle" font-size="10" fill="#6d28d9">Vertical Fwd</text>
    </g>

    <g transform="translate(370, 180)">
      <rect x="0" y="0" width="130" height="35" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="65" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">Valid Fwd Regs</text>
    </g>

    <!-- Output Result Port -->
    <rect x="200" y="390" width="140" height="45" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="270" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">c_out [ACC-1:0]</text>

    <!-- Connectors -->
    <line x1="160" y1="87" x2="210" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="160" y1="142" x2="210" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="160" y1="87" x2="370" y2="90" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <line x1="160" y1="142" x2="370" y2="145" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <line x1="270" y1="145" x2="270" y2="185" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="270" y1="250" x2="270" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M 340 317 L 360 317 L 360 217 L 330 217" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <line x1="270" y1="345" x2="270" y2="390" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <line x1="140" y1="315" x2="200" y2="315" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Operational summary text -->
    <rect x="25" y="470" width="480" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="495" font-size="13" font-weight="bold" fill="#0f172a">Key PE Architecture Highlights:</text>
    <text x="40" y="520" font-size="12" fill="#334155">&#8226; Width-parameterized: scalable for INT8 (DW=8) and INT16 (DW=16).</text>
    <text x="40" y="542" font-size="12" fill="#334155">&#8226; Parameterized Accumulator: 32-bit or 48-bit guarantees overflow safety.</text>
    <text x="40" y="564" font-size="12" fill="#334155">&#8226; Synchronous clear_acc clears local sum in 1 cycle without stalling.</text>
    <text x="40" y="586" font-size="12" fill="#334155">&#8226; Pipelined forward registers: zero routing fanout across array mesh.</text>
    <text x="40" y="608" font-size="12" fill="#334155">&#8226; Dual valid qualifiers: gates accumulation during boundary skewing.</text>
  </g>

  <!-- RIGHT: Scalable N x N Array Mesh & Top Controller -->
  <g transform="translate(585, 85)">
    <rect x="0" y="0" width="635" height="660" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="635" height="42" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="317" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Scalable Matrix Controller &amp; Systolic Mesh</text>

    <!-- Matrix Controller Box -->
    <rect x="30" y="60" width="575" height="100" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="317" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Matrix Controller FSM (IDLE &#8594; LOAD &#8594; COMPUTE &#8594; DRAIN &#8594; DONE)</text>
    <text x="317" y="105" text-anchor="middle" font-size="11" fill="#5b21b6">Deterministic Handshake: start / busy / done pulse; Row-Major bus parsing</text>
    
    <!-- State Flow Mini-diagram -->
    <g transform="translate(60, 115)">
      <rect x="0" y="0" width="80" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <text x="40" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">IDLE</text>
      <text x="95" y="18" font-size="14" fill="#7c3aed">&#8594;</text>

      <rect x="110" y="0" width="80" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <text x="150" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">LOAD</text>
      <text x="205" y="18" font-size="14" fill="#7c3aed">&#8594;</text>

      <rect x="220" y="0" width="95" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <text x="267" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">COMPUTE</text>
      <text x="330" y="18" font-size="14" fill="#7c3aed">&#8594;</text>

      <rect x="345" y="0" width="80" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <text x="385" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">DRAIN</text>
      <text x="440" y="18" font-size="14" fill="#7c3aed">&#8594;</text>

      <rect x="455" y="0" width="55" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <text x="482" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">DONE</text>
    </g>

    <!-- Skewing Pipeline Registers -->
    <rect x="30" y="180" width="180" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="120" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Row Skewing Regs (A)</text>
    <text x="120" y="216" text-anchor="middle" font-size="10" fill="#b45309">Delay = 0 to (N-1) cyc</text>

    <rect x="235" y="180" width="180" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="325" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Col Skewing Regs (B)</text>
    <text x="325" y="216" text-anchor="middle" font-size="10" fill="#b45309">Delay = 0 to (N-1) cyc</text>

    <rect x="435" y="180" width="170" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="520" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Array Clear Gen</text>
    <text x="520" y="216" text-anchor="middle" font-size="10" fill="#b91c1c">Single-cycle sync reset</text>

    <!-- 3x3 / N x N Mesh Illustration -->
    <g transform="translate(60, 245)">
      <!-- Row 0 -->
      <rect x="40" y="20" width="95" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="87" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">PE (0,0)</text>

      <line x1="135" y1="50" x2="185" y2="50" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <rect x="185" y="20" width="95" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="232" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">PE (0,1)</text>

      <line x1="280" y1="50" x2="330" y2="50" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-blue)"/>

      <rect x="330" y="20" width="115" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="387" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">PE (0, N-1)</text>

      <!-- Vertical arrows row 0 to 1 -->
      <line x1="87" y1="80" x2="87" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
      <line x1="232" y1="80" x2="232" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
      <line x1="387" y1="80" x2="387" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Row 1 -->
      <rect x="40" y="120" width="95" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="87" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">PE (1,0)</text>

      <line x1="135" y1="150" x2="185" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <rect x="185" y="120" width="95" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="232" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">PE (1,1)</text>

      <line x1="280" y1="150" x2="330" y2="150" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-blue)"/>

      <rect x="330" y="120" width="115" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="387" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">PE (1, N-1)</text>

      <!-- Vertical dots -->
      <text x="87" y="205" text-anchor="middle" font-size="20" fill="#64748b">&#8942;</text>
      <text x="232" y="205" text-anchor="middle" font-size="20" fill="#64748b">&#8942;</text>
      <text x="387" y="205" text-anchor="middle" font-size="20" fill="#64748b">&#8942;</text>

      <!-- Row N-1 -->
      <rect x="40" y="225" width="95" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="87" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">PE (N-1, 0)</text>

      <line x1="135" y1="255" x2="185" y2="255" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <rect x="185" y="225" width="95" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="232" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">PE (N-1, 1)</text>

      <line x1="280" y1="255" x2="330" y2="255" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-blue)"/>

      <rect x="330" y="225" width="115" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="387" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">PE (N-1, N-1)</text>

      <!-- Output bus vector -->
      <line x1="445" y1="255" x2="495" y2="255" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="475" y="240" font-size="11" font-weight="bold" fill="#047857">C_matrix</text>
    </g>

    <!-- Metrics Box -->
    <rect x="30" y="565" width="575" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="45" y="590" font-size="12" font-weight="bold" fill="#0f172a">Theoretical Closed-Form Equations:</text>
    <text x="45" y="610" font-size="12" fill="#334155">&#8226; Latency = (3N - 1) clock cycles &#160;|&#160; Initiation Interval = 3N cycles</text>
    <text x="45" y="628" font-size="12" fill="#334155">&#8226; Sustained Throughput = N&#179; / (3N) = N&#178; / 3 MACs / cycle (O(N&#178;) scaling)</text>
  </g>
</svg>