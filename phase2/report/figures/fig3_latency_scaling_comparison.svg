<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" width="1150" height="680" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="575" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Execution Latency Scaling: Systolic Array vs. Sequential Baseline</text>
  <text x="575" y="60" text-anchor="middle" font-size="14" fill="#64748b">Theoretical Curves and Exact Hardware Measurement Across Matrix Dimensions N &#8712; {1, 2, 3, 4, 8}</text>

  <!-- Left: Semi-log Latency Plot -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="560" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Latency Scaling Comparison (Clock Cycles)</text>

    <!-- Plot area: width 440, height 360 -->
    <g transform="translate(70, 70)">
      <!-- Axes -->
      <line x1="0" y1="360" x2="440" y2="360" stroke="#475569" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="360" stroke="#475569" stroke-width="2"/>

      <!-- Grid lines (Horizontal: 1, 10, 100, 1000 logarithmic scale) -->
      <!-- y = 360 - 120 * log10(val) -->
      <!-- val = 1: y = 360 -->
      <line x1="0" y1="360" x2="440" y2="360" stroke="#e2e8f0" stroke-width="1"/>
      <text x="-12" y="364" text-anchor="end" font-size="11" fill="#64748b">1</text>

      <!-- val = 10: y = 240 -->
      <line x1="0" y1="240" x2="440" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="244" text-anchor="end" font-size="11" fill="#64748b">10</text>

      <!-- val = 100: y = 120 -->
      <line x1="0" y1="120" x2="440" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="124" text-anchor="end" font-size="11" fill="#64748b">100</text>

      <!-- val = 1000: y = 0 -->
      <line x1="0" y1="0" x2="440" y2="0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
      <text x="-12" y="5" text-anchor="end" font-size="11" fill="#64748b">1000</text>

      <!-- X-axis coordinates: N=1 (x=30), N=2 (x=110), N=3 (x=190), N=4 (x=270), N=8 (x=410) -->
      <text x="30" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">N=1</text>
      <text x="110" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">N=2</text>
      <text x="190" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">N=3</text>
      <text x="270" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">N=4</text>
      <text x="410" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">N=8</text>

      <!-- Sequential Baseline Curve: O(N^3) [RED] -->
      <!-- N=1: val=1, y=360 -->
      <!-- N=2: val=8, y=360-120*0.903 = 251.6 -->
      <!-- N=3: val=27, y=360-120*1.431 = 188.2 -->
      <!-- N=4: val=64, y=360-120*1.806 = 143.3 -->
      <!-- N=8: val=512, y=360-120*2.709 = 34.9 -->
      <polyline points="30,360 110,251.6 190,188.2 270,143.3 410,34.9" fill="none" stroke="#ef4444" stroke-width="3"/>
      <circle cx="30" cy="360" r="5" fill="#ef4444"/>
      <circle cx="110" cy="251.6" r="5" fill="#ef4444"/>
      <circle cx="190" cy="188.2" r="5" fill="#ef4444"/>
      <circle cx="270" cy="143.3" r="5" fill="#ef4444"/>
      <circle cx="410" cy="34.9" r="5" fill="#ef4444"/>

      <!-- Value labels Sequential -->
      <text x="30" y="350" font-size="11" font-weight="bold" fill="#b91c1c">1 cyc</text>
      <text x="110" y="242" font-size="11" font-weight="bold" fill="#b91c1c">8 cyc</text>
      <text x="190" y="178" font-size="11" font-weight="bold" fill="#b91c1c">27 cyc</text>
      <text x="270" y="133" font-size="11" font-weight="bold" fill="#b91c1c">64 cyc</text>
      <text x="390" y="25" font-size="11" font-weight="bold" fill="#b91c1c">512 cyc</text>

      <!-- Systolic Array Curve: O(N) [BLUE] -->
      <!-- N=1: val=2, y=360-120*0.301 = 323.9 -->
      <!-- N=2: val=5, y=360-120*0.699 = 276.1 -->
      <!-- N=3: val=8, y=360-120*0.903 = 251.6 -->
      <!-- N=4: val=11, y=360-120*1.041 = 235.0 -->
      <!-- N=8: val=23, y=360-120*1.362 = 196.6 -->
      <polyline points="30,323.9 110,276.1 190,251.6 270,235.0 410,196.6" fill="none" stroke="#2563eb" stroke-width="3"/>
      <rect x="25" y="318.9" width="10" height="10" fill="#2563eb"/>
      <rect x="105" y="271.1" width="10" height="10" fill="#2563eb"/>
      <rect x="185" y="246.6" width="10" height="10" fill="#2563eb"/>
      <rect x="265" y="230.0" width="10" height="10" fill="#2563eb"/>
      <rect x="405" y="191.6" width="10" height="10" fill="#2563eb"/>

      <!-- Value labels Systolic -->
      <text x="45" y="325" font-size="11" font-weight="bold" fill="#1d4ed8">2 cyc</text>
      <text x="125" y="275" font-size="11" font-weight="bold" fill="#1d4ed8">5 cyc</text>
      <text x="205" y="250" font-size="11" font-weight="bold" fill="#1d4ed8">8 cyc</text>
      <text x="285" y="235" font-size="11" font-weight="bold" fill="#1d4ed8">11 cyc</text>
      <text x="410" y="215" font-size="11" font-weight="bold" fill="#1d4ed8">23 cyc</text>
    </g>

    <!-- Legend -->
    <g transform="translate(80, 480)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#ef4444" stroke-width="3"/>
      <circle cx="15" cy="10" r="4" fill="#ef4444"/>
      <text x="40" y="14" font-size="12" font-weight="bold" fill="#1e293b">Sequential Baseline (N&#179; cycles)</text>

      <line x1="260" y1="10" x2="290" y2="10" stroke="#2563eb" stroke-width="3"/>
      <rect x="270" y="5" width="10" height="10" fill="#2563eb"/>
      <text x="305" y="14" font-size="12" font-weight="bold" fill="#1e293b">Systolic Array (3N - 1 cycles)</text>
    </g>
  </g>

  <!-- Right: Speedup & Performance Table -->
  <g transform="translate(640, 85)">
    <rect x="0" y="0" width="460" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="230" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Measured Performance Speedup Matrix</text>

    <!-- Table -->
    <g transform="translate(25, 60)">
      <!-- Header -->
      <rect x="0" y="0" width="410" height="32" rx="4" fill="#1e293b"/>
      <text x="20" y="21" font-size="11" font-weight="bold" fill="#ffffff">N</text>
      <text x="70" y="21" font-size="11" font-weight="bold" fill="#ffffff">Systolic</text>
      <text x="160" y="21" font-size="11" font-weight="bold" fill="#ffffff">Sequential</text>
      <text x="260" y="21" font-size="11" font-weight="bold" fill="#ffffff">Latency Speedup</text>
      <text x="360" y="21" font-size="11" font-weight="bold" fill="#ffffff">Throughput</text>

      <!-- Row 1: N=1 -->
      <rect x="0" y="35" width="410" height="30" fill="#ffffff"/>
      <text x="20" y="55" font-size="11" font-weight="bold" fill="#334155">1</text>
      <text x="70" y="55" font-size="11" fill="#334155">2 cyc</text>
      <text x="160" y="55" font-size="11" fill="#334155">1 cyc</text>
      <text x="260" y="55" font-size="11" fill="#64748b">0.50x (Crossover)</text>
      <text x="360" y="55" font-size="11" fill="#64748b">0.67x</text>

      <!-- Row 2: N=2 -->
      <rect x="0" y="68" width="410" height="30" fill="#f1f5f9"/>
      <text x="20" y="88" font-size="11" font-weight="bold" fill="#334155">2</text>
      <text x="70" y="88" font-size="11" fill="#334155">5 cyc</text>
      <text x="160" y="88" font-size="11" fill="#334155">8 cyc</text>
      <text x="260" y="88" font-size="11" font-weight="bold" fill="#047857">1.60x</text>
      <text x="360" y="88" font-size="11" font-weight="bold" fill="#047857">1.50x</text>

      <!-- Row 3: N=3 -->
      <rect x="0" y="101" width="410" height="30" fill="#ffffff"/>
      <text x="20" y="121" font-size="11" font-weight="bold" fill="#334155">3</text>
      <text x="70" y="121" font-size="11" fill="#334155">8 cyc</text>
      <text x="160" y="121" font-size="11" fill="#334155">27 cyc</text>
      <text x="260" y="121" font-size="11" font-weight="bold" fill="#047857">3.38x</text>
      <text x="360" y="121" font-size="11" font-weight="bold" fill="#047857">3.11x</text>

      <!-- Row 4: N=4 -->
      <rect x="0" y="134" width="410" height="30" fill="#f1f5f9"/>
      <text x="20" y="154" font-size="11" font-weight="bold" fill="#334155">4</text>
      <text x="70" y="154" font-size="11" fill="#334155">11 cyc</text>
      <text x="160" y="154" font-size="11" fill="#334155">64 cyc</text>
      <text x="260" y="154" font-size="11" font-weight="bold" fill="#047857">5.82x</text>
      <text x="360" y="154" font-size="11" font-weight="bold" fill="#047857">5.42x</text>

      <!-- Row 5: N=8 -->
      <rect x="0" y="167" width="410" height="30" fill="#dbeafe"/>
      <text x="20" y="187" font-size="11" font-weight="bold" fill="#1e40af">8</text>
      <text x="70" y="187" font-size="11" font-weight="bold" fill="#1e40af">23 cyc</text>
      <text x="160" y="187" font-size="11" font-weight="bold" fill="#1e40af">512 cyc</text>
      <text x="260" y="187" font-size="12" font-weight="bold" fill="#1e40af">22.26x</text>
      <text x="360" y="187" font-size="12" font-weight="bold" fill="#1e40af">21.38x</text>
    </g>

    <!-- Key Insights Cards -->
    <g transform="translate(25, 280)">
      <rect x="0" y="0" width="410" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="28" font-size="13" font-weight="bold" fill="#0f172a">Theoretical Speedup Scaling Analysis:</text>

      <text x="20" y="55" font-size="11" font-weight="bold" fill="#2563eb">1. Asymptotic Scaling:</text>
      <text x="30" y="72" font-size="11" fill="#334155">Latency Speedup = N&#179; / (3N - 1) &#8776; N&#178; / 3.</text>
      <text x="30" y="88" font-size="11" fill="#334155">Grows quadratically with matrix dimension N.</text>

      <text x="20" y="112" font-size="11" font-weight="bold" fill="#2563eb">2. Small-N Protocol Crossover:</text>
      <text x="30" y="129" font-size="11" fill="#334155">At N=1, systolic clear and skew overhead exceeds</text>
      <text x="30" y="145" font-size="11" fill="#334155">computation. Systolic dominates at all N &#8805; 2.</text>

      <text x="20" y="169" font-size="11" font-weight="bold" fill="#2563eb">3. Massive N=8 Gain:</text>
      <text x="30" y="186" font-size="11" fill="#334155">At N=8, systolic completes in 230 ns vs. 5,120 ns</text>
      <text x="30" y="202" font-size="11" fill="#334155">sequential baseline (22.26x faster at 100 MHz).</text>
    </g>
  </g>
</svg>