<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" width="1150" height="680" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="575" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Sequential Matrix Multiplication Hardware Baseline Architecture</text>
  <text x="575" y="60" text-anchor="middle" font-size="14" fill="#64748b">Single Reusable MAC Reference Engine (Member 1 Contribution) &#8212; Execution Latency: Exactly N&#179; Clock Cycles</text>

  <!-- Main Container -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="1070" height="560" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="1070" height="42" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="535" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Single-MAC Reference Datapath &amp; Three-State Control FSM</text>

    <!-- Matrix Storage Latches -->
    <g transform="translate(40, 70)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#dbeafe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Matrix A Input Latch</text>
      <text x="110" y="50" text-anchor="middle" font-size="11" fill="#0284c7">[N*N*DATA_WIDTH-1:0]</text>
      <text x="110" y="72" text-anchor="middle" font-size="10" fill="#64748b">Latches once on accepted start</text>

      <rect x="0" y="110" width="220" height="90" rx="8" fill="#dbeafe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="110" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Matrix B Input Latch</text>
      <text x="110" y="160" text-anchor="middle" font-size="11" fill="#0284c7">[N*N*DATA_WIDTH-1:0]</text>
      <text x="110" y="182" text-anchor="middle" font-size="10" fill="#64748b">Latches once on accepted start</text>
    </g>

    <!-- Index Counters (r, c, k) -->
    <g transform="translate(320, 70)">
      <rect x="0" y="0" width="200" height="200" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Nested Index Counters</text>
      <text x="100" y="48" text-anchor="middle" font-size="11" fill="#6d28d9">Total MACs = N&#179; Cycles</text>

      <rect x="20" y="65" width="160" height="35" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
      <text x="100" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Row Counter (r: 0..N-1)</text>

      <rect x="20" y="110" width="160" height="35" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
      <text x="100" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Col Counter (c: 0..N-1)</text>

      <rect x="20" y="155" width="160" height="35" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
      <text x="100" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Dot Product (k: 0..N-1)</text>
    </g>

    <!-- Connectors Latches to Index Selector -->
    <line x1="260" y1="115" x2="320" y2="135" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue2)"/>
    <line x1="260" y1="155" x2="320" y2="170" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue2)"/>

    <!-- Reusable Single MAC Engine -->
    <g transform="translate(580, 70)">
      <rect x="0" y="0" width="220" height="200" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Single Reusable MAC Unit</text>
      <text x="110" y="48" text-anchor="middle" font-size="11" fill="#b45309">Operates at 1 MAC / Cycle</text>

      <!-- Multiplier -->
      <rect x="20" y="65" width="180" height="40" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
      <text x="110" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Signed Mult: A[r,k] * B[k,c]</text>

      <!-- Accumulator -->
      <rect x="20" y="120" width="180" height="60" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
      <text x="110" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Local Accumulator</text>
      <text x="110" y="162" text-anchor="middle" font-size="10" fill="#78350f">Clear when k=0; Accumulate k&gt;0</text>
    </g>

    <line x1="520" y1="150" x2="580" y2="150" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-slate)"/>

    <!-- Output Storage Register -->
    <g transform="translate(850, 70)">
      <rect x="0" y="0" width="180" height="200" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="90" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Output Matrix Reg</text>
      <text x="90" y="48" text-anchor="middle" font-size="10" fill="#166534">[N*N*ACC_WIDTH-1:0]</text>

      <rect x="15" y="70" width="150" height="40" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <text x="90" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Commit when k=N-1</text>

      <rect x="15" y="125" width="150" height="50" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/>
      <text x="90" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">matrix_c_out</text>
      <text x="90" y="163" text-anchor="middle" font-size="10" fill="#166534">Holds stable during idle</text>
    </g>

    <line x1="800" y1="150" x2="850" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green2)"/>

    <!-- Bottom: FSM State Transition & Verification Checklist -->
    <g transform="translate(40, 310)">
      <rect x="0" y="0" width="990" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="30" y="32" font-size="14" font-weight="bold" fill="#0f172a">Three-State Control Handshake &amp; Formal Protocol Guarantees:</text>

      <!-- FSM Diagram -->
      <g transform="translate(30, 50)">
        <circle cx="80" cy="50" r="38" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <text x="80" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">IDLE</text>

        <path d="M 120 40 L 230 40" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue2)"/>
        <text x="175" y="30" text-anchor="middle" font-size="10" fill="#0369a1">start &amp;&amp; !busy</text>

        <circle cx="280" cy="50" r="38" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
        <text x="280" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">COMPUTE</text>
        <text x="280" y="65" text-anchor="middle" font-size="9" fill="#a16207">(N&#179; cycles)</text>

        <path d="M 320 40 L 430 40" fill="none" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow-slate)"/>
        <text x="375" y="30" text-anchor="middle" font-size="10" fill="#854d0e">r=c=k=N-1</text>

        <circle cx="480" cy="50" r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
        <text x="480" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">DONE</text>
        <text x="480" y="65" text-anchor="middle" font-size="9" fill="#15803d">(1 cycle)</text>

        <path d="M 480 90 L 480 120 L 80 120 L 80 90" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green2)"/>
        <text x="280" y="115" text-anchor="middle" font-size="10" fill="#15803d">Auto-return to IDLE</text>
      </g>

      <!-- Guarantees list -->
      <g transform="translate(560, 50)">
        <text x="0" y="20" font-size="12" font-weight="bold" fill="#0f172a">&#8226; Exact Execution Latency:</text>
        <text x="170" y="20" font-size="12" fill="#334155">Exactly N&#179; cycles from start acceptance to done assertion.</text>

        <text x="0" y="45" font-size="12" font-weight="bold" fill="#0f172a">&#8226; Start Immunity:</text>
        <text x="170" y="45" font-size="12" fill="#334155">Second start request while busy is strictly ignored (no queueing/corruption).</text>

        <text x="0" y="70" font-size="12" font-weight="bold" fill="#0f172a">&#8226; Latching Safety:</text>
        <text x="170" y="70" font-size="12" fill="#334155">Changing input buses during computation does not alter ongoing calculation.</text>

        <text x="0" y="95" font-size="12" font-weight="bold" fill="#0f172a">&#8226; Single-Cycle Done:</text>
        <text x="170" y="95" font-size="12" fill="#334155">done pulses high for exactly 1 cycle and automatically resets to 0.</text>

        <text x="0" y="120" font-size="12" font-weight="bold" fill="#0f172a">&#8226; Output Stability:</text>
        <text x="170" y="120" font-size="12" fill="#334155">Matrix result remains stable during subsequent idle clock cycles.</text>
      </g>
    </g>
  </g>
</svg>