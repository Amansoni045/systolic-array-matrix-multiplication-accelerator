<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Matrix Controller Finite State Machine (FSM) &amp; Execution Timeline</text>

  <!-- Part A: FSM State Transition Graph -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="1100" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#334155">A. Controller FSM State Diagram</text>

    <!-- State IDLE (00) -->
    <rect x="60" y="60" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">STATE_IDLE (2'b00)</text>
    <text x="150" y="110" text-anchor="middle" font-size="11" fill="#0284c7">busy = 0, valids = 0</text>
    <text x="150" y="130" text-anchor="middle" font-size="11" fill="#0284c7">latch result when done</text>

    <!-- Transition IDLE -> CLEAR -->
    <path d="M 240 105 L 320 105" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">start = 1</text>

    <!-- State CLEAR (01) -->
    <rect x="330" y="60" width="180" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="420" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">STATE_CLEAR (2'b01)</text>
    <text x="420" y="110" text-anchor="middle" font-size="11" fill="#b91c1c">clear_acc = 1, busy = 1</text>
    <text x="420" y="130" text-anchor="middle" font-size="11" fill="#b91c1c">reset k_cnt = 0</text>

    <!-- Transition CLEAR -> LOAD -->
    <path d="M 510 105 L 590 105" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="550" y="95" text-anchor="middle" font-size="11" fill="#475569">1 cycle</text>

    <!-- State LOAD (10) -->
    <rect x="600" y="60" width="190" height="90" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
    <text x="695" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">STATE_LOAD (2'b10)</text>
    <text x="695" y="110" text-anchor="middle" font-size="11" fill="#a16207">valids = 4'b1111</text>
    <text x="695" y="130" text-anchor="middle" font-size="11" fill="#a16207">Stream A[r][k], B[k][c]</text>

    <!-- Self loop on LOAD -->
    <path d="M 670 60 C 670 30, 720 30, 720 55" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="695" y="25" text-anchor="middle" font-size="10" fill="#854d0e">k_cnt &lt; 3 (k++)</text>

    <!-- Transition LOAD -> DRAIN -->
    <path d="M 790 105 L 870 105" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="830" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">k_cnt == 3</text>

    <!-- State DRAIN (11) -->
    <rect x="880" y="60" width="180" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="970" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">STATE_DRAIN (2'b11)</text>
    <text x="970" y="110" text-anchor="middle" font-size="11" fill="#15803d">valids = 0 (drain)</text>
    <text x="970" y="130" text-anchor="middle" font-size="11" fill="#15803d">d_cnt: 0 to 7 (8 cyc)</text>

    <!-- Self loop on DRAIN -->
    <path d="M 945 60 C 945 30, 995 30, 995 55" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="970" y="25" text-anchor="middle" font-size="10" fill="#166534">d_cnt &lt; 7 (d++)</text>

    <!-- Return transition DRAIN -> IDLE -->
    <path d="M 970 150 C 970 200, 150 200, 150 155" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="560" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">d_cnt == 7 -&gt; result &lt;= acc_in, done = 1 (1 pulse), busy = 0</text>
  </g>

  <!-- Part B: Cycle Schedule & Pipeline Flow Table -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="1100" height="270" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#334155">B. 14-Cycle Hardware Execution Timeline &amp; Data Progression</text>

    <!-- Timeline Grid Header -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="1060" height="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Cycle</text>
      <text x="190" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">FSM State</text>
      <text x="280" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">busy</text>
      <text x="360" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">clear_acc</text>
      <text x="480" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Inputs A &amp; B</text>
      <text x="640" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">valids</text>
      <text x="850" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Pipeline / Systolic Event</text>
      <text x="1010" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">done</text>

      <!-- Row 0: Cycle 0 (CLEAR) -->
      <rect x="0" y="30" width="1060" height="28" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="80" y="49" text-anchor="middle" font-size="11" fill="#0f172a">0</text>
      <text x="190" y="49" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">CLEAR</text>
      <text x="280" y="49" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
      <text x="360" y="49" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">1</text>
      <text x="480" y="49" text-anchor="middle" font-size="11" fill="#64748b">-</text>
      <text x="640" y="49" text-anchor="middle" font-size="11" fill="#64748b">0000</text>
      <text x="850" y="49" text-anchor="middle" font-size="11" fill="#0f172a">Synchronous clear of all 16 PE accumulators &amp; skew registers</text>
      <text x="1010" y="49" text-anchor="middle" font-size="11" fill="#64748b">0</text>

      <!-- Row 1-4: Cycle 1-4 (LOAD) -->
      <rect x="0" y="58" width="1060" height="28" fill="#fefce8" stroke="#e2e8f0"/>
      <text x="80" y="77" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
      <text x="190" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#ca8a04">LOAD (k=0)</text>
      <text x="280" y="77" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
      <text x="360" y="77" text-anchor="middle" font-size="11" fill="#64748b">0</text>
      <text x="480" y="77" text-anchor="middle" font-size="11" fill="#2563eb">A[r][0] / B[0][c]</text>
      <text x="640" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">1111</text>
      <text x="850" y="77" text-anchor="middle" font-size="11" fill="#0f172a">k=0 drives PE(0,0); skew registers buffer rows 1-3 &amp; cols 1-3</text>
      <text x="1010" y="77" text-anchor="middle" font-size="11" fill="#64748b">0</text>

      <rect x="0" y="86" width="1060" height="28" fill="#fefce8" stroke="#e2e8f0"/>
      <text x="80" y="105" text-anchor="middle" font-size="11" fill="#0f172a">2 - 4</text>
      <text x="190" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#ca8a04">LOAD (k=1..3)</text>
      <text x="280" y="105" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
      <text x="360" y="105" text-anchor="middle" font-size="11" fill="#64748b">0</text>
      <text x="480" y="105" text-anchor="middle" font-size="11" fill="#2563eb">A[r][k] / B[k][c]</text>
      <text x="640" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">1111</text>
      <text x="850" y="105" text-anchor="middle" font-size="11" fill="#0f172a">Stream terms k=1, 2, 3; PE(0,0) completes C[0][0] on cycle 4</text>
      <text x="1010" y="105" text-anchor="middle" font-size="11" fill="#64748b">0</text>

      <!-- Row 5-12: Cycle 5-12 (DRAIN) -->
      <rect x="0" y="114" width="1060" height="28" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="80" y="133" text-anchor="middle" font-size="11" fill="#0f172a">5 - 11</text>
      <text x="190" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">DRAIN (d=0..6)</text>
      <text x="280" y="133" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
      <text x="360" y="133" text-anchor="middle" font-size="11" fill="#64748b">0</text>
      <text x="480" y="133" text-anchor="middle" font-size="11" fill="#64748b">-</text>
      <text x="640" y="133" text-anchor="middle" font-size="11" fill="#64748b">0000</text>
      <text x="850" y="133" text-anchor="middle" font-size="11" fill="#0f172a">Operands propagate across mesh; successive diagonals finish C[r][c]</text>
      <text x="1010" y="133" text-anchor="middle" font-size="11" fill="#64748b">0</text>

      <rect x="0" y="142" width="1060" height="28" fill="#f0fdf4" stroke="#e2e8f0"/>
      <text x="80" y="161" text-anchor="middle" font-size="11" fill="#0f172a">12</text>
      <text x="190" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">DRAIN (d=7)</text>
      <text x="280" y="161" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
      <text x="360" y="161" text-anchor="middle" font-size="11" fill="#64748b">0</text>
      <text x="480" y="161" text-anchor="middle" font-size="11" fill="#64748b">-</text>
      <text x="640" y="161" text-anchor="middle" font-size="11" fill="#64748b">0000</text>
      <text x="850" y="161" text-anchor="middle" font-size="11" fill="#166534">Last MAC committed at PE(3,3); all 16 accumulators valid on acc_in</text>
      <text x="1010" y="161" text-anchor="middle" font-size="11" fill="#64748b">0</text>

      <!-- Row 13: Cycle 13 (DONE / IDLE) -->
      <rect x="0" y="170" width="1060" height="28" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
      <text x="80" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">13</text>
      <text x="190" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">IDLE</text>
      <text x="280" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">0</text>
      <text x="360" y="189" text-anchor="middle" font-size="11" fill="#64748b">0</text>
      <text x="480" y="189" text-anchor="middle" font-size="11" fill="#64748b">-</text>
      <text x="640" y="189" text-anchor="middle" font-size="11" fill="#64748b">0000</text>
      <text x="850" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">result &lt;= acc_in latched; done asserted for exactly 1 clock cycle</text>
      <text x="1010" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">1 (pulse)</text>
    </g>
  </g>
</svg>
