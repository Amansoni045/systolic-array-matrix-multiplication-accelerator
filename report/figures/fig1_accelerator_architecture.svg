<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Systolic Array Matrix Multiplication Architecture (4x4, INT8 / INT32)</text>

  <!-- Left: Processing Element (PE) -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="480" height="550" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="480" height="40" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Processing Element (PE) Internal Datapath</text>

    <!-- Inputs -->
    <rect x="20" y="60" width="110" height="35" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">a_in [7:0] (s8)</text>

    <rect x="20" y="115" width="110" height="35" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">b_in [7:0] (s8)</text>

    <!-- Sign Extenders -->
    <rect x="165" y="60" width="85" height="35" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="207" y="82" text-anchor="middle" font-size="11" fill="#334155">SignExt 16b</text>

    <rect x="165" y="115" width="85" height="35" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="207" y="137" text-anchor="middle" font-size="11" fill="#334155">SignExt 16b</text>

    <!-- Multiplier -->
    <polygon points="280,65 340,95 280,125" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="295" y="99" font-size="16" font-weight="bold" fill="#92400e">X</text>
    <text x="345" y="85" font-size="11" fill="#64748b">prod[15:0]</text>

    <!-- Sign Ext to 32b -->
    <rect x="310" y="145" width="90" height="30" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="355" y="164" text-anchor="middle" font-size="11" fill="#334155">SignExt 32b</text>

    <!-- Accumulator Adder -->
    <circle cx="355" cy="225" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="355" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#15803d">+</text>

    <!-- Accumulator Register -->
    <rect x="300" y="285" width="110" height="45" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="355" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Accumulator Reg</text>
    <text x="355" y="322" text-anchor="middle" font-size="11" fill="#047857">acc_out [31:0]</text>

    <!-- Feedback loop -->
    <path d="M 410 307 L 440 307 L 440 225 L 380 225" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Clear & Reset inputs -->
    <path d="M 230 315 L 300 315" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="215" y="310" font-size="10" fill="#dc2626">clear_acc / rst_n</text>

    <!-- Output Ports -->
    <rect x="295" y="365" width="120" height="35" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="355" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">acc_out [31:0]</text>
    <path d="M 355 330 L 355 365" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Forwarding Registers -->
    <g transform="translate(20, 420)">
      <rect x="0" y="0" width="440" height="110" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="220" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Forwarding Registers (Pipelined Systolic Flow)</text>

      <rect x="20" y="35" width="180" height="30" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="110" y="54" text-anchor="middle" font-size="11" fill="#1e40af">a_out &lt;= a_in (Reg 8b)</text>

      <rect x="20" y="72" width="180" height="25" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <text x="110" y="88" text-anchor="middle" font-size="10" fill="#1e40af">a_valid_out &lt;= a_valid_in</text>

      <rect x="240" y="35" width="180" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="330" y="54" text-anchor="middle" font-size="11" fill="#991b1b">b_out &lt;= b_in (Reg 8b)</text>

      <rect x="240" y="72" width="180" height="25" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
      <text x="330" y="88" text-anchor="middle" font-size="10" fill="#991b1b">b_valid_out &lt;= b_valid_in</text>
    </g>

    <!-- Connectors inside PE -->
    <path d="M 130 77 L 165 77" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <path d="M 130 132 L 165 132" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 250 77 L 280 80" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 250 132 L 280 110" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 320 115 L 320 145" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 355 175 L 355 200" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Right: 4x4 Systolic Array & Controller -->
  <g transform="translate(540, 60)">
    <rect x="0" y="0" width="630" height="550" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="630" height="40" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="315" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">4x4 Systolic Array Core &amp; Matrix Controller</text>

    <!-- Matrix Controller Box -->
    <rect x="20" y="55" width="590" height="75" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="315" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Matrix Controller (FSM: IDLE, CLEAR, LOAD, DRAIN)</text>
    <text x="315" y="95" text-anchor="middle" font-size="11" fill="#713f12">Interfaces: start, busy, done, a_flat[255:0], b_flat[255:0], result[511:0]</text>
    <text x="315" y="115" text-anchor="middle" font-size="10" fill="#a16207">Unskewed input streaming | Autonomous 14-cycle execution schedule</text>

    <!-- Top Inputs to Array (B Columns with Skew) -->
    <g transform="translate(190, 140)">
      <text x="-40" y="25" font-size="11" font-weight="bold" fill="#dc2626">B Inputs (Cols):</text>
      <!-- Col 0: 0 delay -->
      <rect x="55" y="5" width="60" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="85" y="23" text-anchor="middle" font-size="10" fill="#991b1b">B[k][0] (0d)</text>
      <!-- Col 1: 1 delay -->
      <rect x="135" y="5" width="60" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="165" y="23" text-anchor="middle" font-size="10" fill="#991b1b">B[k][1] (1d)</text>
      <!-- Col 2: 2 delay -->
      <rect x="215" y="5" width="60" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="245" y="23" text-anchor="middle" font-size="10" fill="#991b1b">B[k][2] (2d)</text>
      <!-- Col 3: 3 delay -->
      <rect x="295" y="5" width="60" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="325" y="23" text-anchor="middle" font-size="10" fill="#991b1b">B[k][3] (3d)</text>
    </g>

    <!-- Left Inputs to Array (A Rows with Skew) -->
    <g transform="translate(25, 185)">
      <text x="60" y="-5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">A Inputs (Rows):</text>
      <!-- Row 0: 0 delay -->
      <rect x="10" y="15" width="100" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="33" text-anchor="middle" font-size="10" fill="#1e40af">A[0][k] (0d)</text>
      <!-- Row 1: 1 delay -->
      <rect x="10" y="85" width="100" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="103" text-anchor="middle" font-size="10" fill="#1e40af">A[1][k] (1d reg)</text>
      <!-- Row 2: 2 delay -->
      <rect x="10" y="155" width="100" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="173" text-anchor="middle" font-size="10" fill="#1e40af">A[2][k] (2d reg)</text>
      <!-- Row 3: 3 delay -->
      <rect x="10" y="225" width="100" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="243" text-anchor="middle" font-size="10" fill="#1e40af">A[3][k] (3d reg)</text>
    </g>

    <!-- 4x4 Grid of PEs -->
    <g transform="translate(220, 185)">
      <!-- 16 PEs -->

      <rect x="15" y="10" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="47" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(0,0)</text>
      <text x="47" y="44" text-anchor="middle" font-size="8" fill="#0284c7">acc[0]</text>
      <line x1="80" y1="31" x2="95" y2="31" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="47" y1="52" x2="47" y2="80" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="95" y="10" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="127" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(0,1)</text>
      <text x="127" y="44" text-anchor="middle" font-size="8" fill="#0284c7">acc[1]</text>
      <line x1="160" y1="31" x2="175" y2="31" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="127" y1="52" x2="127" y2="80" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="175" y="10" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="207" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(0,2)</text>
      <text x="207" y="44" text-anchor="middle" font-size="8" fill="#0284c7">acc[2]</text>
      <line x1="240" y1="31" x2="255" y2="31" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="207" y1="52" x2="207" y2="80" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="255" y="10" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="287" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(0,3)</text>
      <text x="287" y="44" text-anchor="middle" font-size="8" fill="#0284c7">acc[3]</text>
      <line x1="287" y1="52" x2="287" y2="80" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="15" y="80" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="47" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(1,0)</text>
      <text x="47" y="114" text-anchor="middle" font-size="8" fill="#0284c7">acc[4]</text>
      <line x1="80" y1="101" x2="95" y2="101" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="47" y1="122" x2="47" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="95" y="80" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="127" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(1,1)</text>
      <text x="127" y="114" text-anchor="middle" font-size="8" fill="#0284c7">acc[5]</text>
      <line x1="160" y1="101" x2="175" y2="101" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="127" y1="122" x2="127" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="175" y="80" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="207" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(1,2)</text>
      <text x="207" y="114" text-anchor="middle" font-size="8" fill="#0284c7">acc[6]</text>
      <line x1="240" y1="101" x2="255" y2="101" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="207" y1="122" x2="207" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="255" y="80" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="287" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(1,3)</text>
      <text x="287" y="114" text-anchor="middle" font-size="8" fill="#0284c7">acc[7]</text>
      <line x1="287" y1="122" x2="287" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="15" y="150" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="47" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(2,0)</text>
      <text x="47" y="184" text-anchor="middle" font-size="8" fill="#0284c7">acc[8]</text>
      <line x1="80" y1="171" x2="95" y2="171" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="47" y1="192" x2="47" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="95" y="150" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="127" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(2,1)</text>
      <text x="127" y="184" text-anchor="middle" font-size="8" fill="#0284c7">acc[9]</text>
      <line x1="160" y1="171" x2="175" y2="171" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="127" y1="192" x2="127" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="175" y="150" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="207" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(2,2)</text>
      <text x="207" y="184" text-anchor="middle" font-size="8" fill="#0284c7">acc[10]</text>
      <line x1="240" y1="171" x2="255" y2="171" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <line x1="207" y1="192" x2="207" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="255" y="150" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="287" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(2,3)</text>
      <text x="287" y="184" text-anchor="middle" font-size="8" fill="#0284c7">acc[11]</text>
      <line x1="287" y1="192" x2="287" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <rect x="15" y="220" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="47" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(3,0)</text>
      <text x="47" y="254" text-anchor="middle" font-size="8" fill="#0284c7">acc[12]</text>
      <line x1="80" y1="241" x2="95" y2="241" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <rect x="95" y="220" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="127" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(3,1)</text>
      <text x="127" y="254" text-anchor="middle" font-size="8" fill="#0284c7">acc[13]</text>
      <line x1="160" y1="241" x2="175" y2="241" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <rect x="175" y="220" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="207" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(3,2)</text>
      <text x="207" y="254" text-anchor="middle" font-size="8" fill="#0284c7">acc[14]</text>
      <line x1="240" y1="241" x2="255" y2="241" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <rect x="255" y="220" width="65" height="42" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="287" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">PE(3,3)</text>
      <text x="287" y="254" text-anchor="middle" font-size="8" fill="#0284c7">acc[15]</text>

    </g>

    <!-- Bottom Result Collector -->
    <g transform="translate(80, 485)">
      <rect x="0" y="0" width="480" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="240" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">512-bit Output Bus (16 x 32-bit Packed C[r][c] Matrix)</text>
    </g>
  </g>
</svg>
